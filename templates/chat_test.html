<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TexMiles — Assistant Conversational Interactive (Test Local)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 720px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .chat-header {
            background: #0f172a;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-header .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .bot-title {
            font-weight: 600;
            font-size: 16px;
            color: #f8fafc;
        }

        .bot-status {
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        /* Message Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.assistant .bubble {
            background: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Buttons Container */
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .action-button {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-button:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: #334155;
            border-radius: 16px;
            width: fit-content;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s ease;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-info">
                <div class="avatar">📦</div>
                <div>
                    <div class="bot-title">TexMiles Assistant</div>
                    <div class="bot-status">
                        <span class="status-dot"></span> Test Local (FR / WO)
                    </div>
                </div>
            </div>
            <button class="reset-btn" onclick="resetChat()">🔄 Réinitialiser</button>
        </div>

        <!-- Message History -->
        <div class="chat-messages" id="messages"></div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Écrivez un message ou choisissez une option..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        const sessionId = "session_web_" + Math.random().toString(36).substring(2, 9);
        const messagesDiv = document.getElementById("messages");
        const userInput = document.getElementById("userInput");

        // Démarrer la session au chargement
        window.onload = function() {
            sendInteractivePayload("", null);
        };

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage("user", text);
            userInput.value = "";
            sendInteractivePayload(text, null);
        }

        function sendActionButton(actionId, label) {
            appendMessage("user", label);
            sendInteractivePayload(label, actionId);
        }

        function resetChat() {
            messagesDiv.innerHTML = "";
            sendInteractivePayload("reset", null);
        }

        function createActionButton(container, btn) {
            const button = document.createElement("button");
            button.className = "action-button";
            button.type = "button";
            button.textContent = btn.label;
            button.addEventListener("click", function() {
                Array.from(container.querySelectorAll("button")).forEach(item => item.disabled = true);
                sendActionButton(btn.id, btn.label);
            });
            container.appendChild(button);
        }

        function appendMessage(role, text, buttons = [], presentation = "buttons", menuButtonText = "") {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${role}`;

            // Embellir le markdown gras
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            messageDiv.innerHTML = `<div class="bubble">${formattedText}</div>`;

            if (buttons && buttons.length > 0) {
                const container = document.createElement("div");
                container.className = "buttons-container";
                if (presentation === "list") {
                    const menuButton = document.createElement("button");
                    menuButton.className = "action-button";
                    menuButton.type = "button";
                    menuButton.textContent = menuButtonText || "Voir les options";
                    menuButton.addEventListener("click", function() {
                        menuButton.remove();
                        buttons.forEach(btn => createActionButton(container, btn));
                    });
                    container.appendChild(menuButton);
                } else {
                    buttons.forEach(btn => createActionButton(container, btn));
                }
                messageDiv.appendChild(container);
            }
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement("div");
            typingDiv.className = "message assistant";
            typingDiv.id = "typingIndicator";
            typingDiv.innerHTML = `
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById("typingIndicator");
            if (typing) typing.remove();
        }

        async function sendInteractivePayload(message, actionId) {
            showTyping();
            try {
                const response = await fetch("/api/v1/chat/interactive", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message,
                        action_id: actionId
                    })
                });

                removeTyping();
                if (!response.ok) {
                    appendMessage("assistant", "⚠️ Erreur de communication avec le serveur.");
                    return;
                }

                const data = await response.json();
                appendMessage(
                    "assistant",
                    data.text,
                    data.buttons,
                    data.presentation,
                    data.menu_button_text
                );
            } catch (err) {
                removeTyping();
                appendMessage("assistant", "⚠️ Impossible de contacter l'assistant.");
            }
        }
    </script>
</body>
</html>
